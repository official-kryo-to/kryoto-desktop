name: Preview build

# Installers for testing a pull request, without releasing anything.
#
# Add the `preview-build` label to a PR (and every push after that rebuilds
# it), or run this by hand from the Actions tab. The installers are attached
# to the workflow run as artifacts - nothing goes on a GitHub release and no
# latest.json is written, so no installed copy is offered this build. The
# version stays whatever the branch has; the real release still happens on the
# version bump (release.yml).
#
# Running by hand needs this file on the default branch first (GitHub only
# lists workflows from there). The label works on any PR that carries it.
on:
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'preview-build')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Chat's cryptography (Cargo path dependency ../kryoto-messaging).
      # Goes away once the dependency becomes a pinned git revision.
      - name: Fetch kryoto-messaging
        shell: bash
        run: git clone --depth 1 https://github.com/official-kryo-to/kryoto-messaging.git ../kryoto-messaging
      # The controller resolver (Cargo path dependency ../kryoto-padmap).
      - name: Fetch kryoto-padmap
        shell: bash
        run: git clone --depth 1 https://github.com/official-kryo-to/kryoto-padmap.git ../kryoto-padmap
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # SQLCipher compiles OpenSSL from source, which needs a full Perl
      # (MSYS/Git's is missing modules Configure needs), NASM, and MSVC.
      # The linker is pinned by path as well: in a bash step Git's own
      # `link.exe` shadows MSVC's on PATH.
      - name: OpenSSL toolchain (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          [ -d "C:/Strawberry/perl/bin" ] || { echo "::error::Strawberry Perl is gone from the runner image."; exit 1; }
          echo "C:/Strawberry/perl/bin" >> "$GITHUB_PATH"
          choco install nasm -y --no-progress
          VSWHERE="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          LINK=$("$VSWHERE" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC/Tools/MSVC/*/bin/Hostx64/x64/link.exe' | head -1)
          [ -n "$LINK" ] || { echo "::error::No MSVC link.exe found."; exit 1; }
          echo "MSVC link.exe: $LINK"
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$(echo "$LINK" | sed 's|\\|/|g')" >> "$GITHUB_ENV"
          export PATH="/c/Strawberry/perl/bin:$PATH"
          which perl; which nasm
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev libssl-dev libudev-dev

      - run: pnpm install --frozen-lockfile

      # No updater artifacts: they need the signing key, which a PR build must
      # not touch, and a preview is never offered as an update anyway.
      - name: Build the installers
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          echo '{"bundle":{"createUpdaterArtifacts":false}}' > preview.conf.json
          pnpm app:build --config preview.conf.json

      - name: Collect them
        shell: bash
        run: |
          bundle=src-tauri/target/release/bundle
          mkdir -p out
          if [ "${{ matrix.platform }}" = "windows" ]; then
            cp "$bundle"/nsis/*-setup.exe out/
          else
            cp "$bundle"/appimage/*.AppImage "$bundle"/deb/*.deb out/
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: kryoto-desktop-${{ matrix.platform }}-${{ github.event.pull_request.number && format('pr{0}', github.event.pull_request.number) || format('run{0}', github.run_number) }}
          path: out/*
          retention-days: 14
