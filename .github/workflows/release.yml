name: Release

# Fires on a VERSION BUMP, not on every push.
#
# The first job reads `version` out of src-tauri/tauri.conf.json and stops
# unless that version has no tag yet. So the release ritual is: bump the
# version in package.json, src-tauri/Cargo.toml and src-tauri/tauri.conf.json
# (the job refuses to go on when they differ), add the entry to kryo.to's
# CHANGELOG.md (this app has none of its own), push. No tagging by hand, and
# no accidental release from an unrelated commit.
#
# The installers land on a GitHub release, which is where kryo.to/desktop's
# download buttons get them (kryo.to's lib/desktop-release.ts): Windows
# (NSIS setup), Linux (AppImage and .deb).
#
# The same release carries the in-app updater's files: a minisign signature
# (.sig) beside each installer, and latest.json, which every installed copy
# reads from releases/latest/download/latest.json (tauri.conf.json
# `plugins.updater`). Signing uses the TAURI_SIGNING_PRIVATE_KEY secret (and
# its _PASSWORD) - Kryoto Desktop's own key, whose public half is
# `plugins.updater.pubkey` in tauri.conf.json. Without it there is no latest.json and no installed copy
# ever sees a new version, so the build refuses to run.
on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/tauri.conf.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:

# One release at a time; a second bump waits rather than racing the first.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      needed: ${{ steps.v.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          cargo=$(sed -n 's/^version *= *"\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)
          if [ "$version" != "$pkg" ] || [ "$version" != "$cargo" ]; then
            echo "::error::Versions differ: tauri.conf.json $version, package.json $pkg, Cargo.toml $cargo. Bump all three."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "v$version is already tagged; nothing to release."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  create-release:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - name: Create the draft release
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ needs.check.outputs.version }}';
            const tag = `v${version}`;
            const { owner, repo } = context.repo;
            // A draft left by a run that failed part-way has no tag yet, so the
            // check above cannot see it. Clear it, or this release would be
            // created beside it and the half-empty one could be published.
            const drafts = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            for (const old of drafts.filter((r) => r.draft && r.tag_name === tag)) {
              core.info(`Removing the leftover draft ${old.id} for ${tag}`);
              await github.rest.repos.deleteRelease({ owner, repo, release_id: old.id });
            }
            const { data } = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `Kryoto Desktop ${version}`,
              body: `Kryoto Desktop ${version} for Windows and Linux.\n\nWhat changed is in the kryo.to changelog: https://kryo.to/changelog`,
              draft: true,
              prerelease: false,
            });
            return data.id;

  build:
    needs: [check, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          # 22.04, not ubuntu-latest: the Tauri packages below keep these names
          # there; 24.04 renamed the appindicator one. It is also the oldest
          # glibc the AppImage and .deb should still run on.
          - os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Chat's cryptography (Cargo path dependency ../kryoto-messaging).
      # Goes away once the dependency becomes a pinned git revision.
      - name: Fetch kryoto-messaging
        shell: bash
        run: git clone --depth 1 https://github.com/official-kryo-to/kryoto-messaging.git ../kryoto-messaging
      # The controller resolver (Cargo path dependency ../kryoto-padmap).
      - name: Fetch kryoto-padmap
        shell: bash
        run: git clone --depth 1 https://github.com/official-kryo-to/kryoto-padmap.git ../kryoto-padmap
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # SQLCipher compiles OpenSSL from source, which needs a full Perl
      # (MSYS/Git's is missing modules Configure needs), NASM, and MSVC.
      # The linker is pinned by path as well: in a bash step Git's own
      # `link.exe` shadows MSVC's on PATH.
      - name: OpenSSL toolchain (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          [ -d "C:/Strawberry/perl/bin" ] || { echo "::error::Strawberry Perl is gone from the runner image."; exit 1; }
          echo "C:/Strawberry/perl/bin" >> "$GITHUB_PATH"
          choco install nasm -y --no-progress
          VSWHERE="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          LINK=$("$VSWHERE" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC/Tools/MSVC/*/bin/Hostx64/x64/link.exe' | head -1)
          [ -n "$LINK" ] || { echo "::error::No MSVC link.exe found."; exit 1; }
          echo "MSVC link.exe: $LINK"
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$(echo "$LINK" | sed 's|\\|/|g')" >> "$GITHUB_ENV"
          export PATH="/c/Strawberry/perl/bin:$PATH"
          which perl; which nasm
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev libssl-dev libudev-dev

      # `bundle.createUpdaterArtifacts` is on, so a build without the key dies
      # inside `tauri build` with the signing error buried in its log. Say so
      # up front instead.
      - name: Require the updater signing key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. Without it there is no latest.json, and every installed copy stays on its current version. Set it (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD) in the repository secrets: the key whose public half is plugins.updater.pubkey in tauri.conf.json."
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      # Fail the release rather than ship something that does not pass. PowerShell
      # on purpose: in a bash step Git's MSYS perl shadows Strawberry's and
      # OpenSSL's Configure fails (build.mjs only sanitizes PATH for the build
      # itself, below). Same reason CI's test steps use the default shell.
      - name: Check
        shell: pwsh
        run: |
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cd src-tauri
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # `app:build` is `tauri build` with the build machine's paths remapped out
      # of the binary, and it fails if any are still in it (scripts/build.mjs).
      - name: Build the installers
        env:
          # The AppImage tooling is itself an AppImage; without FUSE on the
          # runner it has to unpack itself instead of mounting.
          APPIMAGE_EXTRACT_AND_RUN: '1'
          # Signs every updater artifact (the .sig beside each installer).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        # `tauri build` only WARNS when the key does not match the public key
        # in tauri.conf.json, and signs anyway: every installed copy would then
        # refuse the update ("signed with a different key"), which is how
        # Forge's updater stayed dead for seven releases. Fail here instead.
        run: |
          set -o pipefail
          pnpm app:build 2>&1 | tee build.log
          if grep -q "does not match the public key" build.log; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY does not match plugins.updater.pubkey in tauri.conf.json. Installed copies would refuse this update."
            exit 1
          fi

      - name: Attach them to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ needs.check.outputs.version }}"
          bundle=src-tauri/target/release/bundle
          mkdir -p out
          # Plain names: GitHub turns the space in "Kryoto Desktop" into a dot,
          # and kryo.to picks the files by their endings. The version in the
          # glob keeps an older build left in the cache from being picked up.
          # Each installer's signature goes up under the installer's new name
          # plus .sig; the manifest job below pairs them by that name.
          if [ "${{ matrix.platform }}" = "windows" ]; then
            cp "$bundle"/nsis/*_"${v}"_x64-setup.exe "out/Kryoto-Desktop_${v}_x64-setup.exe"
            cp "$bundle"/nsis/*_"${v}"_x64-setup.exe.sig "out/Kryoto-Desktop_${v}_x64-setup.exe.sig"
          else
            cp "$bundle"/appimage/*_"${v}"_amd64.AppImage "out/Kryoto-Desktop_${v}_amd64.AppImage"
            cp "$bundle"/appimage/*_"${v}"_amd64.AppImage.sig "out/Kryoto-Desktop_${v}_amd64.AppImage.sig"
            cp "$bundle"/deb/*_"${v}"_amd64.deb "out/Kryoto-Desktop_${v}_amd64.deb"
            # Newer bundlers sign the .deb as well; an installed .deb only
            # updates itself when one is there.
            for sig in "$bundle"/deb/*_"${v}"_amd64.deb.sig; do
              [ -f "$sig" ] && cp "$sig" "out/Kryoto-Desktop_${v}_amd64.deb.sig"
            done
          fi
          ls -la out
          gh release upload "v$v" out/* --clobber

  # latest.json: what every installed copy reads to learn there is a new
  # version. Written once both platforms are up, from the signatures on the
  # release, so it can never name a file that is not there.
  manifest:
    needs: [check, create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Write latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          v="${{ needs.check.outputs.version }}"
          mkdir -p sigs && cd sigs
          gh release download "v$v" --repo "$REPO" --pattern '*.sig'
          ls -la
          V="$v" REPO="$REPO" node -e '
            const fs = require("fs");
            const v = process.env.V, base = `https://github.com/${process.env.REPO}/releases/download/v${v}/`;
            const entry = (file) => {
              const sig = `${file}.sig`;
              if (!fs.existsSync(sig)) return null;
              return { signature: fs.readFileSync(sig, "utf8").trim(), url: base + file };
            };
            const win = entry(`Kryoto-Desktop_${v}_x64-setup.exe`);
            const appimage = entry(`Kryoto-Desktop_${v}_amd64.AppImage`);
            const deb = entry(`Kryoto-Desktop_${v}_amd64.deb`);
            if (!win || !appimage) {
              console.error("::error::A Windows or AppImage signature is missing from the release; not writing a latest.json that would strand one platform.");
              process.exit(1);
            }
            // The updater looks for {os}-{arch}-{installer} first. The plain
            // windows key is the fallback for older copies; there is none for
            // Linux, so a .deb install never gets handed an AppImage.
            const platforms = { "windows-x86_64-nsis": win, "windows-x86_64": win, "linux-x86_64-appimage": appimage };
            if (deb) platforms["linux-x86_64-deb"] = deb;
            const manifest = {
              version: v,
              notes: "What changed is in the kryo.to changelog: https://kryo.to/changelog",
              pub_date: new Date().toISOString(),
              platforms,
            };
            fs.writeFileSync("latest.json", JSON.stringify(manifest, null, 2));
            console.log(JSON.stringify(manifest, null, 2));
          '
          gh release upload "v$v" latest.json --repo "$REPO" --clobber

  publish:
    needs: [check, create-release, build, manifest]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
              make_latest: 'true',
            });
