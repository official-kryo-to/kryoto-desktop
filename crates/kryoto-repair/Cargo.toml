[package]
name = "kryoto-repair"
version = "0.1.0"
edition = "2021"
license = "MIT"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "time", "fs", "io-util", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
walkdir = "2"
regex = "1"
tracing = "0.1"
sevenz-rust = "0.6"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
fs2 = "0.4"
url = "2"
futures-util = "0.3"
